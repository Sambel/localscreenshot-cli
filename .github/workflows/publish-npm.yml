name: publish npm

# Runs only for a version tag. The "release" environment requires an approval and accepts v* tags only.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: The tag must be the version of the package
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          if [ "$name" != "localscreenshot" ]; then echo "Unexpected package name: $name"; exit 1; fi
          if [ "v$version" != "$TAG" ]; then echo "Tag $TAG does not match package version $version"; exit 1; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: npm test

      # Trusted publishing needs a recent npm. The version is fixed: the tool that signs the package is not
      # whatever happens to be latest on the day of a release.
      - name: Fixed npm version
        run: npm install -g npm@12.2.0

      - name: Skip if this version is already published
        id: check
        run: |
          set -euo pipefail
          if npm view "localscreenshot@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "localscreenshot@$VERSION is already on the registry, nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with provenance
        if: steps.check.outputs.already == 'false'
        run: npm publish --access public --provenance
