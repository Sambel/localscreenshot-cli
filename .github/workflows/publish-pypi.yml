name: publish pypi

# Runs only for a version tag. The "release" environment requires an approval and accepts v* tags only.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: The tag must be the version of the package
        working-directory: python
        run: |
          set -euo pipefail
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          name="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")"
          if [ "$name" != "localscreenshot" ]; then echo "Unexpected project name: $name"; exit 1; fi
          if [ "v$version" != "$TAG" ]; then echo "Tag $TAG does not match project version $version"; exit 1; fi

      - name: Test
        working-directory: python
        run: python -m unittest discover -s tests

      - name: Build
        run: |
          set -euo pipefail
          python -m pip install build==1.6.1
          python -m build --outdir dist python
          ls -l dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
